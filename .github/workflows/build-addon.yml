name: Survival Bazaar Add-on bauen

on:
  push:
    paths:
      - 'source/**'
      - '.github/workflows/build-addon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript-Syntax prüfen
        run: node --check source/SurvivalBazaar_BP/scripts/main.js
      - name: PNG-Dateiköpfe normalisieren
        run: |
          python3 - <<'PY'
          import pathlib, struct, zlib
          slash = bytes([92])
          prefix = slash + b"x89PNG" + slash + b"r" + slash + b"n" + slash + b"x1a" + slash + b"n"
          png_header = bytes([137, 80, 78, 71, 13, 10, 26, 10])
          fixed = []
          for path in pathlib.Path("source/SurvivalBazaar_RP/textures").rglob("*.png"):
              data = path.read_bytes()
              if data.startswith(prefix):
                  data = png_header + data[len(prefix):]
              if not data.startswith(png_header):
                  raise ValueError(f"Ungültiger PNG-Kopf: {path}")
              pos, chunks, idat = 8, [], b""
              while pos < len(data):
                  size = struct.unpack(">I", data[pos:pos+4])[0]
                  kind = data[pos+4:pos+8]
                  chunk = data[pos+8:pos+8+size]
                  if kind == b"IDAT":
                      idat += chunk
                  else:
                      chunks.append((kind, chunk))
                  pos += 12 + size
              raw = zlib.decompress(idat)
              width, height, depth, color, comp, filt, interlace = struct.unpack(">IIBBBBB", data[16:29])
              channels = {0:1, 2:3, 3:1, 4:2, 6:4}[color]
              expected = height * (1 + width * channels * depth // 8)
              repaired = raw.replace(slash + b"x00", bytes([0]))
              if len(raw) != expected and len(repaired) == expected:
                  raw = repaired
                  compressed = zlib.compress(raw, 9)
                  rebuilt = png_header
                  inserted = False
                  for kind, chunk in chunks:
                      if kind == b"IEND" and not inserted:
                          crc = zlib.crc32(b"IDAT" + compressed) & 0xffffffff
                          rebuilt += struct.pack(">I", len(compressed)) + b"IDAT" + compressed + struct.pack(">I", crc)
                          inserted = True
                      crc = zlib.crc32(kind + chunk) & 0xffffffff
                      rebuilt += struct.pack(">I", len(chunk)) + kind + chunk + struct.pack(">I", crc)
                  data = rebuilt
                  fixed.append(str(path))
              path.write_bytes(data)
          print("Normalisierte/reparierte PNG-Dateien:", fixed)
          PY
      - name: JSON-, Modell- und Texturzuordnungen prüfen
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          root = pathlib.Path("source")
          bp = root / "SurvivalBazaar_BP"
          rp = root / "SurvivalBazaar_RP"
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          atlas = json.loads((rp / "textures/terrain_texture.json").read_text())
          models = {}
          for path in (rp / "models/blocks").glob("*.geo.json"):
              data = json.loads(path.read_text())
              for geo in data.get("minecraft:geometry", []):
                  models[geo.get("description", {}).get("identifier")] = path
          for path in (bp / "blocks").glob("*.json"):
              data = json.loads(path.read_text())
              block = data["minecraft:block"]
              comp = block["components"]
              geo = comp["minecraft:geometry"]["identifier"]
              texture = comp["minecraft:material_instances"]["*"]["texture"]
              assert geo in models, f"Fehlendes Modell: {path} -> {geo}"
              assert texture in atlas["texture_data"], f"Fehlende Texturzuordnung: {path} -> {texture}"

          # Jede Block-ID braucht auch einen Resource-Pack-Eintrag mit gültiger Textur.
          block_atlas = json.loads((rp / "blocks.json").read_text())
          block_ids = set()
          for path in (bp / "blocks").glob("*.json"):
              block = json.loads(path.read_text())["minecraft:block"]
              identifier = block["description"]["identifier"]
              block_ids.add(identifier)
              assert identifier in block_atlas, f"Fehlender blocks.json-Eintrag: {identifier}"
              texture = block_atlas[identifier].get("textures")
              textures = texture if isinstance(texture, list) else [texture]
              for name in textures:
                  assert isinstance(name, str) and name in atlas["texture_data"], f"Ungültige Blocktextur: {identifier} -> {name}"
              # Die Laufzeit-Blocktextur muss zur vorgesehenen Möbeltextur passen.
              # Barhocker sind absichtlich unsichtbare Anker; ihre Item-Textur
              # wird separat über minecraft:item_visual gesetzt.
              if identifier == "survivalbazaar:bar_stool":
                  assert block["components"]["minecraft:material_instances"]["*"]["texture"] == "furniture_anchor", "Barhocker-Ankertextur wurde verändert"
              else:
                  runtime_texture = block["components"]["minecraft:material_instances"]["*"]["texture"]
                  assert runtime_texture == texture, f"Falsche Laufzeit-Textur: {identifier} -> {runtime_texture}, erwartet {texture}"
          for path in (rp / "textures").rglob("*.png"):
              data = path.read_bytes()
              assert data.startswith(bytes([137,80,78,71,13,10,26,10])), f"Ungültige PNG: {path}"
              w, h, depth, color, comp, filt, interlace = struct.unpack(">IIBBBBB", data[16:29])
              pos, idat = 8, b""
              while pos < len(data):
                  size = struct.unpack(">I", data[pos:pos+4])[0]
                  kind = data[pos+4:pos+8]
                  if kind == b"IDAT": idat += data[pos+8:pos+8+size]
                  pos += 12 + size
              channels = {0:1, 2:3, 3:1, 4:2, 6:4}[color]
              expected = h * (1 + w * channels * depth // 8)
              assert len(__import__("zlib").decompress(idat)) == expected, f"Beschädigter PNG-Bilddatenstrom: {path}"
              assert w > 1 and h > 1 and (len(data) > 200 or path.name in {"furniture_anchor.png", "bed.png", "chair.png", "fridge.png", "mirror.png", "sofa.png", "table.png", "tv.png"}), f"Platzhalter-/leere Textur: {path}"
          # Loot-Tabellen, Atlas-Dateien und Block-Referenzen prüfen.
          for path in (bp / "blocks").glob("*.json"):
              block = json.loads(path.read_text())["minecraft:block"]
              loot = block.get("components", {}).get("minecraft:loot")
              if loot:
                  assert (bp / loot).is_file(), f"Fehlende Loot-Tabelle: {path} -> {loot}"
          for name, entry in atlas["texture_data"].items():
              values = entry.get("textures")
              values = values if isinstance(values, list) else [values]
              for value in values:
                  value = value if isinstance(value, str) else value.get("path")
                  assert value and (rp / (value + ".png")).is_file(), f"Fehlende Atlas-Textur: {name} -> {value}"

          # Jedes Behavior-Entity braucht ein passendes Client-Entity und Modell.
          behavior_entities = {}
          for path in (bp / "entities").glob("*.json"):
              entity = json.loads(path.read_text())["minecraft:entity"]
              identifier = entity["description"]["identifier"]
              behavior_entities[identifier] = entity
          entity_geometries = {}
          for path in (rp / "models/entity").glob("*.geo.json"):
              for geo in json.loads(path.read_text()).get("minecraft:geometry", []):
                  entity_geometries[geo["description"]["identifier"]] = path
          client_entities = {}
          for path in (rp / "entity").glob("*.entity.json"):
              desc = json.loads(path.read_text())["minecraft:client_entity"]["description"]
              identifier = desc["identifier"]
              client_entities[identifier] = desc
              geometry = desc.get("geometry", {}).get("default")
              assert geometry in entity_geometries, f"Fehlende Entity-Geometrie: {path} -> {geometry}"
              texture = desc.get("textures", {}).get("default")
              assert texture and (rp / (texture + ".png")).is_file(), f"Fehlende Entity-Textur: {path} -> {texture}"
          assert set(behavior_entities) == set(client_entities), "Behavior-/Client-Entity-IDs stimmen nicht überein"
          seat_entities = {
              "survivalbazaar:modern_sofa_display",
              "survivalbazaar:modern_chair_display",
              "survivalbazaar:armchair_display",
              "survivalbazaar:bar_stool_display",
          }
          for identifier in seat_entities:
              assert identifier in behavior_entities, f"Fehlende Sitz-Entity: {identifier}"
              rideable = behavior_entities[identifier].get("components", {}).get("minecraft:rideable")
              assert rideable and rideable.get("seat_count", 0) > 0, f"Sitz-Entity nicht reitbar: {identifier}"
              assert rideable.get("seats"), f"Sitzposition fehlt: {identifier}"

          # Die im Shop gelisteten eigenen Möbel müssen als Blöcke existieren.
          import re
          script = (bp / "scripts/main.js").read_text(encoding="utf-8")
          custom_shop_ids = set(re.findall(r'id:\s*"(survivalbazaar:[a-z0-9_]+)"', script))
          block_ids = {json.loads(p.read_text())["minecraft:block"]["description"]["identifier"] for p in (bp / "blocks").glob("*.json")}
          assert custom_shop_ids <= block_ids, f"Shop-Möbel ohne Blockdefinition: {sorted(custom_shop_ids - block_ids)}"
          print("JSON, Block-/Entity-IDs, Rideable-Entities, Loot-Tabellen, 3D-Modelle, Texturzuordnungen und PNG-Dateien geprüft.")
          PY
      - name: Behavior- und Resource-Pack paketieren
        run: |
          set -e
          test -f source/SurvivalBazaar_BP/manifest.json
          test -f source/SurvivalBazaar_RP/manifest.json
          mkdir -p dist
          (cd source/SurvivalBazaar_BP && zip -qr ../../dist/SurvivalBazaar_BP.mcpack .)
          (cd source/SurvivalBazaar_RP && zip -qr ../../dist/SurvivalBazaar_RP.mcpack .)
          cd dist
          zip -q SurvivalBazaar.mcaddon SurvivalBazaar_BP.mcpack SurvivalBazaar_RP.mcpack
          unzip -t SurvivalBazaar.mcaddon
      - uses: actions/upload-artifact@v4
        with:
          name: SurvivalBazaar-Bedrock-26.60
          path: dist/SurvivalBazaar.mcaddon
          if-no-files-found: error
