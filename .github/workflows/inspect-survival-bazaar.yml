name: Inspect Survival Bazaar archives
on:
  push:
    paths:
      - '.github/workflows/inspect-survival-bazaar.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve uploaded archives for inspection
        run: |
          mkdir -p inspect
          cp "SurvivalBazaar-Warenkorb-v2-2.mcaddon (1)" inspect/ 2>/dev/null || true
          cp SurvivalBazaar_BP.zip SurvivalBazaar_RP.zip inspect/
      - uses: actions/upload-artifact@v4
        with:
          name: survival-bazaar-source-archives
          path: inspect/
          if-no-files-found: error
